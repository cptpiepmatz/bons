[package]
name = "bons"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bons"
path = "backend/src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", default-features = false, features = [
  "sqlite",
  "runtime-tokio",
  "derive",
  "macros",
  "chrono",
  "migrate"
] }
