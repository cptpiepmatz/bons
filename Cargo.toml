[package]
name = "bons"
version = "0.1.0"
edition = "2021"
build = "backend/build.rs"

[lib]
path = "backend/src/lib.rs"

[[example]]
name = "seed"
path = "backend/examples/seed.rs"

[[bin]]
name = "bons"
path = "backend/src/main.rs"

[dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
cookie = "0.18"
serde = { version = "1", features = ["derive"] }
ts-rs = "12.0.1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", default-features = false, features = [
  "sqlite",
  "runtime-tokio",
  "derive",
  "macros",
  "chrono",
  "migrate",
] }
rand = "0.10.3"
rust-embed = { version = "8.13", features = ["mime-guess"] }
base64 = "0.23.1"
sha2 = "0.11.0"
strum = { version = "0.28.0", features = ["derive"] }
chrono = "0.4"

[build-dependencies]
quote = "1"
serde_json = "1"

[dev-dependencies]
static-toml = "1.3.0"
sys-locale = "0.3.2"
