[package]
name = "bons"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bons"
path = "backend/src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", default-features = false, features = [
  "sqlite",
  "runtime-tokio",
  "derive",
  "macros",
  "chrono",
  "migrate",
] }
rand = "0.10.2"
base64 = "0.23.1"
sha2 = "0.11.0"
strum = { version = "0.28.0", features = ["derive"] }
chrono = "0.4"
